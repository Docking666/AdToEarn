# ------------------------------------------------------------
# 反向解析参数
# ------------------------------------------------------------
reverse_parser:
  video_frames: 4
  video_frame_quality: 95
  analysis_prompt_file: "config/prompts/analysis.txt"

# ------------------------------------------------------------
# 生成参数
# ------------------------------------------------------------
generator:
  default_count: 3
  max_count: 10
  style_migration:
    min_keywords: 5

# ------------------------------------------------------------
# 广告账户审计 (Audit)
# 对投放效果进行可视化数据分析：总览指标 / 时间趋势 / 账户对比 / 异常风险
# 数据来源：用户通过 WebUI 导入（CSV/JSON）或生成示例数据（标注 sample=true）
#
# 数据模型（双轨制，Phase1 升级）：
#   每条记录 = { raw: {原始所有字段}, mapped: {映射后标准字段}, tags: {} }
#   raw   : 用户上传 CSV 的原始字段，全部保留，不做任何强制映射
#   mapped: 经字段映射引擎处理后的 7 个标准字段（account/date/impressions/clicks/
#           conversions/spend/conversion_value），用于指标计算与异常检测
#   tags  : 行级标签（Phase2 批量打标用），结构 {group_name: [tag_values]}
#
# 字段映射引擎（三层 fallback，参照 Supermetrics/Funnel 业界实践，0 LLM 成本）：
#   1) 同义词字典精确匹配（预置中英文 + 用户扩展自动学习）
#   2) rapidfuzz 模糊匹配（Levenshtein + Jaro-Winkler 混合评分）
#   3) 人工兜底（前端高亮未映射字段，用户选择后自动写入字典）
# 派生指标：CTR=点击/曝光 · CVR=转化/点击 · CPC=花费/点击 · CPM=花费/曝光*1000
#          CPA=花费/转化 · ROAS=转化价值/花费
# ------------------------------------------------------------
audit:
  # 数据持久化文件（运行时生成，不入库）
  data_file: "cache/audit_data.json"
  # 字段映射配置持久化（用户自定义映射 + 学习的同义词）
  field_map_file: "config/audit_field_map.json"

  # 字段映射引擎配置
  field_map:
    # 模糊匹配阈值（0-1，低于此分数不自动匹配，留给人工）
    fuzzy_threshold: 0.85
    # 标准字段定义（mapped 域的 7 个字段 + 业务语义）
    # label       前端展示名
    # unit        单位（用于指标卡）
    # required    是否必需（缺则指标卡隐藏，但不阻塞导入）
    # warn        口径警告（映射时前端提示）
    standard_fields:
      account:
        label: "账户"
        unit: ""
        required: true
        warn: ""
      date:
        label: "日期"
        unit: ""
        required: true
        warn: ""
      impressions:
        label: "曝光量"
        unit: ""
        required: false
        warn: ""
      clicks:
        label: "点击量"
        unit: ""
        required: false
        warn: "⚠️ Meta 的 clicks 含资料页点击，与 Google 的 link_clicks 口径不同"
      conversions:
        label: "转化量"
        unit: ""
        required: false
        warn: "⚠️ 各平台转化归因窗口不同（Meta 7d click+1d view / Google 30d click），跨平台对比需统一口径"
      spend:
        label: "花费"
        unit: "¥"
        required: false
        warn: "⚠️ 多币种需先统一汇率再对比"
      conversion_value:
        label: "转化价值"
        unit: "¥"
        required: false
        warn: ""
    # 预置中英文同义词字典（业界主流平台字段别名）
    # 格式：标准字段: [别名列表]；用户纠正过的映射会自动追加到此字典的"用户扩展"区
    synonyms:
      account:
        - "账户"
        - "账户名"
        - "账户名称"
        - "广告账户"
        - "ad_account"
        - "account_name"
        - "account_id"
        - "customer_id"
        - "账户 ID"
      date:
        - "日期"
        - "投放日期"
        - "统计日期"
        - "day"
        - "report_date"
        - "date_start"
        - "date_end"
        - "segments.date"
        - "统计时间"
        - "时间"
      impressions:
        - "曝光"
        - "曝光量"
        - "展示量"
        - "展现量"
        - "imp"
        - "impr"
        - "impressions_count"
        - "impression_cnt"
        - "impr_cnt"
        - "展示次数"
        - "曝光次数"
      clicks:
        - "点击"
        - "点击量"
        - "点击次数"
        - "游玩量"
        - "link_clicks"
        - "link_click"
        - "clicks_count"
        - "click_cnt"
        - "clk"
        - "点击数"
      conversions:
        - "转化"
        - "转化量"
        - "转化数"
        - "转化次数"
        - "conversion"
        - "conversions_count"
        - "转化人数"
        - "订单数"
        - "购买数"
      spend:
        - "花费"
        - "消耗"
        - "金额"
        - "cost"
        - "费用"
        - "广告费"
        - "spend_amount"
        - "cost_micros"
        - "total_spend"
        - "消耗金额"
        - "实际花费"
      conversion_value:
        - "转化价值"
        - "转化金额"
        - "销售额"
        - "收入"
        - "revenue"
        - "conversion_value"
        - "conv_value"
        - "conv_val"
        - "order_value"
        - "GMV"
        - "转化收入"
        - "订单金额"
    # 用户扩展同义词（运行时自动学习用户纠正的映射，初始为空）
    user_synonyms: {}

  # 示例数据生成参数（用于演示/测试，前端标注「示例数据」）
  sample:
    days: 30
    accounts:
      - "主账户-品牌"
      - "搜索-精准"
      - "信息流-素材测试"
      - "海外-Meta"
    base_impressions: 80000
    base_spend: 800
    min_conversions: 4
  # 异常检测阈值
  anomaly:
    # 花费较前 7 日均值超过该倍数 → 花费突增
    spend_surge_ratio: 3.0
    # CTR 低于前 7 日均值该比例 → 点击率骤降
    ctr_drop_ratio: 0.5
    # 账户 CPA 高于整体均值该倍数 → 获客成本过高
    cpa_surge_ratio: 2.0
    # 连续有花费但无转化的天数 → 转化中断
    no_conversion_days: 3
    # ROAS 低于该值 → 投入产出比警戒
    roas_warn_below: 1.0
    # 单日曝光低于该值 → 曝光不足提示
    min_impressions: 10000
    # 样本天数少于该值 → 数据样本不足提示
    min_sample_days: 14
  # 健康评分扣分（参照 Claude-ads：基础 100，按严重度扣分）
  health_score:
    critical: -25
    high: -15
    medium: -8
    low: -3
    grades: ["A", "B", "C", "D"]
    grade_thresholds: [90, 75, 60, 0]

  # ------------------------------------------------------------
  # 标签库（Phase2 批量打标）
  # 打标粒度：每行原始记录（=单个素材投放计划）
  # 标签结构：tags = {group_name: [tag_value1, tag_value2, ...]}
  # 一行可同时有多个标签组的多个标签值，用于多维透视聚合
  # ------------------------------------------------------------
  tag_groups:
    # 预设通用标签组（用户可在 WebUI 自定义扩展）
    - id: "creative_keyword"
      name: "素材关键词"
      description: "素材的核心创意关键词（如：国潮风 / 极简主义 / 情感叙事）"
      tags: ["国潮风", "极简主义", "情感叙事", "产品展示", "KOL种草", "情景剧", "对比测评", "开箱"]
    - id: "audience"
      name: "人群包"
      description: "目标受众定向（如：Z世代 / 宝妈 / 商务人士）"
      tags: ["Z世代", "宝妈", "商务人士", "银发族", "小镇青年", "新中产", "学生党", "垂类爱好者"]
    - id: "edit_strategy"
      name: "剪辑策略"
      description: "视频素材的剪辑手法（如：快节奏 / 慢镜头 / 字幕卡点）"
      tags: ["快节奏", "慢镜头", "字幕卡点", "转场特效", "口播", "画中画", "前3秒钩子", "BGM驱动"]
  # 用户自定义标签持久化文件（运行时生成，不入库）
  tag_lib_file: "config/audit_tag_lib.json"

  # ------------------------------------------------------------
  # 信号规则引擎（Phase3 升级）
  # 数据信号体系（合并原「异常检测」+ 新增统计规则），每条规则可勾选启用/禁用，
  # 默认全部启用。启用状态持久化到 rule_state_file（用户关闭后重启仍保留）。
  # 检测方法（参照 marqops / improvado 业界实践，纯 Python 零依赖）：
  #   1) 中位数 + MAD 抗离群基线（替代均值 ± 标准差）
  #   2) 三层严重度：magnitude（%变化）+ statistical rarity（z-score）+ duration（持续天数）
  #   3) 同周几季节性基线（对比前 N 个同周几，而非连续 7 天）
  #   4) 业务影响估算（impact.amount，按预估金额排序）
  #   5) 数据质量信号与业务信号分流（转化归零区分「追踪中断」与「业务下滑」）
  # 信号统一 schema：
  #   { severity, category, title, description, impact:{amount,desc},
  #     metrics:{z_score,magnitude,duration_days}, account, date, suggestion }
  # ------------------------------------------------------------
  # 信号规则启用状态持久化文件
  rule_state_file: "config/audit_rule_state.json"
  # 信号规则定义（id 稳定，前端勾选用）
  signal_rules:
    # ---- 突增类 ----
    spend_surge:
      name: "花费突增"
      description: "某账户/组合当日花费显著高于自身历史水平（MAD 抗离群基线）"
      category: "surge"          # surge | decay | inefficiency | data_quality | hint
      default_enabled: true
      # 检测方法：window=窗口累计法（最近N天累计 vs 历史日均中位数，抗噪声）；
      #           daily=逐日法（每日 MAD z-score 逐日检测，对单日突变更敏感）
      # 可在前端规则面板切换
      method: "window"
      # MAD 基线窗口（天）
      baseline_window: 14
      # 同周几窗口（天，0=用连续窗口）
      weekday_window: 4
      # 三层严重度阈值（daily 方法用）
      z_threshold: 3.0           # 中高严重度（保留，备用）
      z_high_threshold: 5.0      # 高严重度（保留，备用）
      # window 方法阈值：最小变化幅度（%）：窗口累计需翻倍才算突增（过滤随机波动）
      min_change_pct: 100.0
      min_impact_amount: 5000.0  # 业务影响下限（元），低于不触发
      duration_days: 2           # 持续天数（窗口累计天数，防单日噪声）
      # 业务影响估算：花费突增的超额花费
      impact_field: "spend"
    # ---- 衰减类 ----
    ctr_drop:
      name: "点击率骤降"
      description: "曝光足量时 CTR 显著低于自身历史水平（素材疲劳 / 展示质量下降）"
      category: "decay"
      default_enabled: true
      # 检测方法：window=窗口累计法；daily=逐日法（可在前端切换）
      method: "window"
      baseline_window: 14
      weekday_window: 4
      z_threshold: 3.0
      z_high_threshold: 5.0
      min_change_pct: 50.0       # 最小下降幅度（%），过滤随机波动
      min_impact_amount: 2000.0  # 业务影响下限（元）
      duration_days: 2
      impact_field: "spend"
      # 专用：曝光量下限（低于视为样本不足不检测）
      min_impressions: 10000
    # ---- 低效类 ----
    roas_low:
      name: "投产比低于警戒线"
      description: "某账户/组合 ROAS 持续低于警戒线（花费未产生足够转化价值）"
      category: "inefficiency"
      default_enabled: true
      roas_warn_below: 1.0
      duration_days: 3           # 持续 3 天才触发，避免单日波动
      min_impact_amount: 1000.0
    cpa_high:
      name: "获客成本过高"
      description: "某账户/组合 CPA 显著高于整体均值（预算浪费信号）"
      category: "inefficiency"
      default_enabled: true
      cpa_surge_ratio: 2.0
      min_impact_amount: 0.0
    # ---- 数据质量类 ----
    no_conversion:
      name: "连续花费无转化"
      description: "有花费但转化量为 0，自动分流：若曝光正常 → 数据质量问题（追踪中断）；否则 → 业务下滑"
      category: "data_quality"
      default_enabled: true
      no_conversion_days: 3
      min_impact_amount: 500.0
      # 分流阈值：当日曝光相对自身基线未下降超过该比例 → 判定为追踪中断
      tracking_break_imp_ratio: 0.7
    # ---- 提示类 ----
    small_sample:
      name: "数据样本不足"
      description: "数据覆盖天数少于阈值，统计结论可靠性有限"
      category: "hint"
      default_enabled: true
      min_sample_days: 14
      min_impact_amount: 0.0
    low_impressions:
      name: "曝光量不足"
      description: "总曝光低于阈值，样本可能不足以支撑可靠结论"
      category: "hint"
      default_enabled: true
      min_impressions: 10000
      min_impact_amount: 0.0
    # ---- 权重变化类（Phase4，需标签数据） ----
    weight_shift:
      name: "标签组合权重变化"
      description: "某标签组合在本批数据中的花费占比显著变化（策略调整迹象），仅在有打标数据时生效"
      category: "shift"
      default_enabled: true
      # 近期窗口（天）与历史基线窗口（天）
      recent_days: 7
      baseline_days: 14
      # 占比变化阈值（绝对值，如 0.2 = 占比变化超 20% 触发）
      min_share_change: 0.2
      # 组合最小占比（低于此占比的组合忽略，防噪声）
      min_share: 0.05
      # 最小花费影响（元）
      min_impact_amount: 1000.0

  # ------------------------------------------------------------
  # 多维透视（Phase4）
  # 按标签组组合聚合：dimensions=[tag_group_id, ...] → 各组合的 sum/avg 指标
  # ------------------------------------------------------------
  pivot:
    # 透视聚合的指标（可透视字段）
    metrics: ["spend", "conversions", "impressions", "clicks", "conversion_value"]

# ------------------------------------------------------------
# LLM 大模型提供商模板 (经 LiteLLM 网关统一调用)
# 密钥与自定义端点通过 WebUI 写入 config/api_config.json
# custom 为自定义入口：任意 OpenAI 兼容接口（api_base + api_key + model）
# 字段说明：
#   default_base_url    官方 API 地址（切换提供商时前端自动填充）
#   supports_vision     是否支持图片/视频分析（false 时前端隐藏视觉模型字段）
#   vision_default_model 视觉模型默认值；留空 = 多模态（直接用对话模型即可，如 qwen-VL / GLM-4V）
# ------------------------------------------------------------
llm:
  # 默认 LLM 配置 ID (未指定时按顺序取第一个 enabled)
  default_provider: "openai"
  providers:
    openai:
      name: "OpenAI"
      litellm_prefix: "openai"
      default_base_url: "https://api.openai.com/v1"
      default_model: "gpt-4o"
      vision_default_model: "gpt-4o"
      supports_vision: true
      supports_web_search: true
    anthropic:
      name: "Anthropic (Claude)"
      litellm_prefix: "anthropic"
      default_base_url: "https://api.anthropic.com"
      default_model: "claude-sonnet-4-20250514"
      vision_default_model: "claude-sonnet-4-20250514"
      supports_vision: true
      supports_web_search: true
    google:
      name: "Google Gemini"
      litellm_prefix: "gemini"
      default_base_url: "https://generativelanguage.googleapis.com"
      default_model: "gemini-1.5-pro"
      vision_default_model: "gemini-1.5-pro"
      supports_vision: true
      supports_web_search: true
    azure:
      name: "Azure OpenAI"
      litellm_prefix: "azure"
      default_base_url: ""
      default_model: "gpt-4o"
      vision_default_model: "gpt-4o"
      supports_vision: true
      supports_web_search: true
    deepseek:
      name: "DeepSeek"
      litellm_prefix: "deepseek"
      default_base_url: "https://api.deepseek.com"
      default_model: "deepseek-chat"
      vision_default_model: ""
      supports_vision: false
      # Responses API 原生支持 web_search（服务端执行），仅 deepseek-v4-flash 模型可用
      supports_web_search: true
      web_search_note: "仅 deepseek-v4-flash 模型（Responses API）"
      responses_api: true
    qwen:
      name: "通义千问 (DashScope)"
      litellm_prefix: "openai"
      default_base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      default_model: "qwen-plus"
      vision_default_model: "qwen-vl-max"
      supports_vision: true
      # 多模态模型列表：这些对话模型本身支持图片，无需单独配置视觉模型
      multimodal_models: ["qwen-vl-max", "qwen-vl-plus", "qwen2.5-vl-72b-instruct"]
    zhipu:
      name: "智谱 GLM"
      litellm_prefix: "openai"
      default_base_url: "https://open.bigmodel.cn/api/paas/v4"
      default_model: "glm-4-flash"
      vision_default_model: "glm-4v-plus"
      supports_vision: true
      # GLM 原生支持 web_search 工具（search_pro 引擎，中文效果好）
      supports_web_search: true
      web_search_note: "GLM 原生 web_search 工具（search_pro）"
      multimodal_models: ["glm-4v-plus", "glm-4v", "glm-4v-flash"]
    custom:
      name: "自定义 (OpenAI 兼容)"
      litellm_prefix: "openai"
      default_base_url: ""
      default_model: ""
      vision_default_model: ""
      supports_vision: true
      is_custom: true

# ------------------------------------------------------------
# 视频生成 (Video API 提供商模板)
# 密钥、自定义端点等敏感配置通过 WebUI 写入 config/api_config.json
# 此处仅定义提供商的默认端点、模型与字段映射
# ------------------------------------------------------------
video:
  # 任务轮询参数
  poll_interval_sec: 5
  poll_max_attempts: 60
  task_ttl_minutes: 120
  providers:
    seedance:
      name: "Seedance (豆包·即梦)"
      default_endpoint: "https://ark.cn-beijing.volces.com/api/v3"
      default_model: "doubao-seedance-1-0-pro"
      supported_durations: [5, 10]
      supported_resolutions: ["480p", "720p", "1080p"]
      duration_default: 5
      resolution_default: "720p"
    minimax:
      name: "MiniMax H3 (海螺AI)"
      default_endpoint: "https://api.minimax.chat/v1"
      default_model: "Hailuo_03"
      supported_durations: [6, 10]
      supported_aspect_ratios: ["16:9", "9:16", "4:3", "3:4"]
      duration_default: 6
      aspect_ratio_default: "16:9"
    custom:
      name: "自定义视频 API"
      default_endpoint: ""
      default_model: ""
      supported_durations: [5, 10]
      supported_resolutions: ["480p", "720p", "1080p"]
      supported_aspect_ratios: ["16:9", "9:16"]
      duration_default: 5
      resolution_default: "720p"
      is_custom: true

