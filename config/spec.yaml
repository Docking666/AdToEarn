    color_palette: ["#FDF6E3", "#D4A574", "#8B7355", "#3E3B32"]
    tone: "warm, authentic, relatable"
    reference: "Lifestyle photography, natural lighting, everyday scenes, warm color grading"
  luxury:
    name: "高端商务"
    description: "奢华质感的高端品牌风格"
    visual_style: "luxury, premium, elegant, gold accents, dark theme, sophisticated"
    color_palette: ["#1A1A2E", "#C9A961", "#E8E8E8", "#16213E"]
