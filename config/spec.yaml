# ============================================================
# AdToEarn SDD 规范配置 (Spec-Driven Development)
# 所有配置项、路径、参数统一在此管理，禁止在代码中硬编码
# ============================================================

app:
  name: "AdToEarn WebUI"
  version: "2.0.0"
  description: "广告素材采集 · 反向解析 · 风格迁移生成"

# 调试配置
debug:
  # Mock 调试开关：默认关闭。关闭时未配置 API 直接返回错误与配置引导；
  # 开启时使用模拟数据（输出带「模拟数据」标识）
  mock_enabled: false

server:
  host: "127.0.0.1"
  port: 8765

paths:
  base_dir: "."
  upload_dir: "uploads"
  cache_dir: "cache"
  web_dir: "web"
  templates_dir: "web/templates"
  static_dir: "web/static"

upload:
  max_file_size_mb: 100
  allowed_image_extensions: [".jpg", ".jpeg", ".png", ".gif", ".webp", ".bmp"]
  allowed_video_extensions: [".mp4", ".mov", ".avi", ".mkv", ".webm"]

# ------------------------------------------------------------
# AI 配置 (密钥通过 .env 注入, spec 只定义行为参数)
# ------------------------------------------------------------
ai:
  # OpenAI 兼容接口
  base_url_env: "OPENAI_BASE_URL"
  api_key_env: "OPENAI_API_KEY"
  text_model_env: "OPENAI_MODEL"
  vision_model_env: "OPENAI_VISION_MODEL"
  defaults:
    base_url: "https://api.openai.com/v1"
    text_model: "gpt-4o"
    vision_model: "gpt-4o"
  generation:
    temperature: 0.8
    max_tokens: 3000
  vision:
    temperature: 0.4
    max_tokens: 2500
  analysis:
    temperature: 0.4
    max_tokens: 2000
  copywriting:
    temperature: 0.9
  keyword:
    temperature: 0.5

# ------------------------------------------------------------
# 数据采集 (Playwright)
# ------------------------------------------------------------
scraper:
  headless: true
  timeout_ms: 30000
  viewport:
    width: 1920
    height: 1080
  locale: "zh-CN"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  keyword_extraction:
    min_len: 2
    max_len: 4
  sources:
    youmiyoushu:
      name: "有米有数"
      url: "https://www.youmi.net"
      search_url: "https://www.youmi.net/creative/search"
      strategy: "url"
      item_selector: [".creative-item", ".ad-card", ".result-item", '[class*="creative"]']
      title_selector: [".title", ".ad-title", "h3", "h4"]
      desc_selector: [".desc", ".description", "p"]
      tags_selector: [".tag", ".label", '[class*="tag"]']
      stats_selector: [".stat", ".metric", '[class*="data"]']
      thumbnail_selector: ["img"]
    appgrowing:
      name: "AppGrowing"
      url: "https://www.appgrowing.cn"
      search_url: "https://www.appgrowing.cn/search"
      strategy: "auto"
      search_input_selector: "input[type='text']"
      search_button_selector: "button"
      item_selector: [".creative-item", ".ad-card", ".result-item", '[class*="creative"]']
      title_selector: [".title", ".ad-title", "h3", "h4"]
      desc_selector: [".desc", ".description", "p"]
      tags_selector: [".tag", ".label", '[class*="tag"]']
      stats_selector: [".stat", ".metric", '[class*="data"]']
      thumbnail_selector: ["img"]
    admetrics:
      name: "广告查查"
      url: "https://www.admetrics.cn"
      search_url: "https://www.admetrics.cn/search"
      strategy: "url"
      item_selector: [".creative-item", ".ad-card", ".result-item", '[class*="creative"]']
      title_selector: [".title", ".ad-title", "h3", "h4"]
      desc_selector: [".desc", ".description", "p"]
      tags_selector: [".tag", ".label", '[class*="tag"]']
      stats_selector: [".stat", ".metric", '[class*="data"]']
      thumbnail_selector: ["img"]
  # 采集行为
  behavior:
    # 页面加载后额外等待（毫秒），给 SPA 渲染时间
    wait_after_load_ms: 2500
    # 内容选择器等待超时（毫秒）
    wait_selector_timeout_ms: 8000
    # 重试次数
    retry_count: 2
    # 重试基础延迟（毫秒，指数退避: base * 2^attempt）
    retry_base_delay_ms: 1500
    # 随机延迟范围（毫秒），模拟人类行为
    random_delay_min_ms: 500
    random_delay_max_ms: 1500

# ------------------------------------------------------------
# 联网搜索 (LLM Web Search)
# 通过 LLM 的 Web Search 工具获取公开索引的广告素材情报，
# 天然规避目标站点登录墙与反爬。密钥复用「API 配置」的 LLM 密钥。
# ------------------------------------------------------------
websearch:
  # 首选提供商: openai | anthropic
  # 未配置该提供商密钥时自动尝试另一个，都无则报错引导
  provider: "openai"
  # OpenAI: web_search 工具上下文量 (low/medium/high)
  search_context_size: "medium"
  # 域名白名单（空=不限）；OpenAI 最多 20 个，Anthropic 支持
  allowed_domains: []
  # 单次搜索返回来源上限（提示词约束）
  max_results: 10
  # 默认时间范围（天），通过提示词注入日期区间
  date_range_days: 7
  # 并发上限（同时进行的搜索请求数）
  concurrency: 3
  # 429 限流重试
  retry_count: 2
  retry_base_delay_ms: 2000
  # 成本熔断（美元，进程内累计，达阈值后拒绝新请求）
  daily_budget_usd: 5.0

# ------------------------------------------------------------
# 素材风格模板 (迁移生成的目标风格)
# ------------------------------------------------------------
