# ------------------------------------------------------------
# 反向解析参数
# ------------------------------------------------------------
reverse_parser:
  video_frames: 4
  video_frame_quality: 95
  analysis_prompt_file: "config/prompts/analysis.txt"

# ------------------------------------------------------------
# 生成参数
# ------------------------------------------------------------
generator:
  default_count: 3
  max_count: 10
  style_migration:
    min_keywords: 5

# ------------------------------------------------------------
# LLM 大模型提供商模板 (经 LiteLLM 网关统一调用)
# 密钥与自定义端点通过 WebUI 写入 config/api_config.json
# custom 为自定义入口：任意 OpenAI 兼容接口（api_base + api_key + model）
# 字段说明：
#   default_base_url    官方 API 地址（切换提供商时前端自动填充）
#   supports_vision     是否支持图片/视频分析（false 时前端隐藏视觉模型字段）
#   vision_default_model 视觉模型默认值；留空 = 多模态（直接用对话模型即可，如 qwen-VL / GLM-4V）
# ------------------------------------------------------------
llm:
  # 默认 LLM 配置 ID (未指定时按顺序取第一个 enabled)
  default_provider: "openai"
  providers:
    openai:
      name: "OpenAI"
      litellm_prefix: "openai"
      default_base_url: "https://api.openai.com/v1"
      default_model: "gpt-4o"
      vision_default_model: "gpt-4o"
      supports_vision: true
    anthropic:
      name: "Anthropic (Claude)"
      litellm_prefix: "anthropic"
      default_base_url: "https://api.anthropic.com"
      default_model: "claude-sonnet-4-20250514"
      vision_default_model: "claude-sonnet-4-20250514"
      supports_vision: true
    google:
      name: "Google Gemini"
      litellm_prefix: "gemini"
      default_base_url: "https://generativelanguage.googleapis.com"
      default_model: "gemini-1.5-pro"
      vision_default_model: "gemini-1.5-pro"
      supports_vision: true
    azure:
      name: "Azure OpenAI"
      litellm_prefix: "azure"
      default_base_url: ""
      default_model: "gpt-4o"
      vision_default_model: "gpt-4o"
      supports_vision: true
    deepseek:
      name: "DeepSeek"
      litellm_prefix: "deepseek"
      default_base_url: "https://api.deepseek.com"
      default_model: "deepseek-chat"
      vision_default_model: ""
      supports_vision: false
    qwen:
      name: "通义千问 (DashScope)"
      litellm_prefix: "openai"
      default_base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      default_model: "qwen-plus"
      vision_default_model: "qwen-vl-max"
      supports_vision: true
      # 多模态模型列表：这些对话模型本身支持图片，无需单独配置视觉模型
      multimodal_models: ["qwen-vl-max", "qwen-vl-plus", "qwen2.5-vl-72b-instruct"]
    zhipu:
      name: "智谱 GLM"
      litellm_prefix: "openai"
      default_base_url: "https://open.bigmodel.cn/api/paas/v4"
      default_model: "glm-4-flash"
      vision_default_model: "glm-4v-plus"
      supports_vision: true
      multimodal_models: ["glm-4v-plus", "glm-4v", "glm-4v-flash"]
    custom:
      name: "自定义 (OpenAI 兼容)"
      litellm_prefix: "openai"
      default_base_url: ""
      default_model: ""
      vision_default_model: ""
      supports_vision: true
      is_custom: true

# ------------------------------------------------------------
# 视频生成 (Video API 提供商模板)
# 密钥、自定义端点等敏感配置通过 WebUI 写入 config/api_config.json
# 此处仅定义提供商的默认端点、模型与字段映射
# ------------------------------------------------------------
video:
  # 任务轮询参数
  poll_interval_sec: 5
  poll_max_attempts: 60
  task_ttl_minutes: 120
  providers:
    seedance:
      name: "Seedance (豆包·即梦)"
      default_endpoint: "https://ark.cn-beijing.volces.com/api/v3"
      default_model: "doubao-seedance-1-0-pro"
      supported_durations: [5, 10]
      supported_resolutions: ["480p", "720p", "1080p"]
      duration_default: 5
      resolution_default: "720p"
    minimax:
      name: "MiniMax H3 (海螺AI)"
      default_endpoint: "https://api.minimax.chat/v1"
      default_model: "Hailuo_03"
      supported_durations: [6, 10]
      supported_aspect_ratios: ["16:9", "9:16", "4:3", "3:4"]
      duration_default: 6
      aspect_ratio_default: "16:9"
    custom:
      name: "自定义视频 API"
      default_endpoint: ""
      default_model: ""
      supported_durations: [5, 10]
      supported_resolutions: ["480p", "720p", "1080p"]
      supported_aspect_ratios: ["16:9", "9:16"]
      duration_default: 5
      resolution_default: "720p"
      is_custom: true

